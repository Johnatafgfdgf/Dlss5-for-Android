plugins { id 'com.android.application' }

android {
    namespace 'com.dlss5.vulkanlab'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.dlss5.vulkanlab'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {}
